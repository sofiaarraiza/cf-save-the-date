<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,500;1,600&family=Jost:wght@300;400;500;600&family=Caveat:wght@500;600;700&family=Pinyon+Script" rel="stylesheet">
  <style>
    body { margin: 0; background: #F7F4ED; overflow-x: hidden; }
    * { box-sizing: border-box; }
    ::selection { background: #800020; color: #F7F4ED; }
    a { color: #800020; }
    a:hover { color: #5c0017; }
    @font-face { font-family: 'Mencken Std Head Narrow'; src: url('./assets/fonts/mencken-std-head-narrow.otf') format('opentype'); font-weight: normal; font-style: normal; }
  </style>
</helmet>

<div style="font-family: 'Jost', sans-serif; background: #F7F4ED; color: #3d3630; position: relative; min-height: 100vh;">

  <!-- NAV -->
  <div style="position: sticky; top: 0; z-index: 100; background: #F7F4ED; border-bottom: 1px solid rgba(138,154,138,0.25);">
  <div style="{{ navStyle }}">
    <sc-if value="{{ notMobile }}">
      <div style="display: flex; align-items: center; gap: 28px;">
        <a href="./Save the Date v3.dc.html#hero" style="{{ navLinkStyle }}">Inicio</a>
        <a href="./Save the Date v3.dc.html#detalles" style="{{ navLinkStyle }}">Cuándo y dónde</a>
        <a href="./Save the Date v3.dc.html#rsvp" style="{{ navLinkStyle }}">Asistencia</a>
      </div>
    </sc-if>
    <sc-if value="{{ true }}" hint-placeholder-val="{{ true }}">
      <a href="./Save the Date v3.dc.html#hero"><img src="./assets/monogram-cf-original.png" alt="Cami &amp; Fede" style="{{ logoStyle }}"/></a>
    </sc-if>
    <sc-if value="{{ notMobile }}">
      <div style="display: flex; align-items: center; gap: 28px; justify-self: end;">
        <a href="./Save the Date v3.dc.html#dresscode" style="{{ navLinkStyle }}">Dress code</a>
        <a href="./Libro de Invitados.dc.html" style="{{ navLinkStyle }}">Invitados</a>
        <a href="./Nuestra Historia.dc.html" style="{{ navLinkStyle }}">Nuestra historia</a>
      </div>
    </sc-if>
    <button onClick="{{ toggleMenu }}" aria-label="Menu" style="{{ menuButtonStyle }}">
      <span style="{{ barTopStyle }}"></span>
      <span style="{{ barMidStyle }}"></span>
      <span style="{{ barBotStyle }}"></span>
    </button>
  </div>
  </div>

  <div style="{{ menuOverlayStyle }}">
    <a href="./Save the Date v3.dc.html#hero" onClick="{{ closeMenu }}" style="{{ menuLinkStyle }}">Inicio</a>
    <a href="./Save the Date v3.dc.html#detalles" onClick="{{ closeMenu }}" style="{{ menuLinkStyle }}">Cuándo y dónde</a>
    <a href="./Save the Date v3.dc.html#countdown" onClick="{{ closeMenu }}" style="{{ menuLinkStyle }}">Countdown</a>
    <a href="./Save the Date v3.dc.html#rsvp" onClick="{{ closeMenu }}" style="{{ menuLinkStyle }}">Asistencia</a>
    <a href="./Save the Date v3.dc.html#dresscode" onClick="{{ closeMenu }}" style="{{ menuLinkStyle }}">Dress code</a>
    <a href="./Save the Date v3.dc.html#historia" onClick="{{ closeMenu }}" style="{{ menuLinkStyle }}">Galería</a>
    <a href="./Libro de Invitados.dc.html" style="{{ menuLinkStyle }}">Libro de invitados</a>
    <a href="./Nuestra Historia.dc.html" style="{{ menuLinkStyle }}">Nuestra historia</a>
  </div>

  <!-- HEADER -->
  <section style="position: relative; padding: 64px 24px 48px; text-align: center; background: #F7F4ED; overflow: hidden;">
    <div style="position: absolute; inset: 0; background-image: url('./assets/floral-pattern-burgundy.png'); background-size: 460px 460px; background-repeat: repeat; opacity: 0.08; pointer-events: none;"></div>
    <h1 style="font-family: 'Mencken Std Head Narrow', 'Arial Narrow', Arial, sans-serif; font-weight: 400; font-size: clamp(40px, 7vw, 56px); letter-spacing: 1px; text-transform: uppercase; color: #800020; margin: 0;">Nuestra historia</h1>
  </section>

  <!-- FOOTER -->
  <footer data-screen-label="Footer" style="padding: 60px 20px 40px; text-align: center; background: #F7F4ED; color: #3d3630; border-top: 1px solid rgba(128,0,32,0.25);">
    <div style="font-family: 'Mencken Std Head Narrow', 'Arial Narrow', Arial, sans-serif; font-weight: 400; font-size: clamp(44px, 8.5vw, 64px); text-transform: uppercase; color: rgb(61, 54, 48); margin-bottom: 18px; white-space: nowrap;"><span style="font-family: 'Pinyon Script', cursive; font-weight: 400; font-size: 1.5em; margin-right: 0.05em;">C</span>ami <span style="margin-left: 2px;">&amp;</span> <span style="font-family: 'Pinyon Script', cursive; font-weight: 400; font-size: 1.5em; margin-right: 0.18em;">F</span>ede</div>
    <div style="width: 40px; height: 1px; background: rgba(61,54,48,0.3); margin: 0 auto 18px;"></div>
    <p style="font-size: 17px; font-weight: 500; margin: 0 0 6px;">17 de Octubre, 2026 · Zabala Paz Eventos</p>
    <p style="font-family: 'Mencken Std Head Narrow', 'Arial Narrow', Arial, sans-serif; font-weight: 400; font-size: 20px; letter-spacing: 0.5px; margin: 18px 0 0; color: #800020;">Los esperamos para celebrar</p>
  </footer>

</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = {
    menuOpen: false,
    isMobile: typeof window !== 'undefined' && window.innerWidth < 640,
  };

  componentDidMount() {
    this.onResize = () => this.setState((s) => (s.isMobile === window.innerWidth < 640 ? null : { isMobile: window.innerWidth < 640 }));
    window.addEventListener('resize', this.onResize);
  }
  componentWillUnmount() { window.removeEventListener('resize', this.onResize); }

  toggleMenu = () => this.setState((s) => ({ menuOpen: !s.menuOpen }));
  closeMenu = () => this.setState({ menuOpen: false });

  navStyle = () => ({
    position: 'relative',
    display: this.state.isMobile ? 'flex' : 'grid',
    gridTemplateColumns: this.state.isMobile ? undefined : '1fr auto 1fr',
    alignItems: 'center', justifyContent: 'space-between',
    maxWidth: '1200px', margin: '0 auto',
    padding: '10px 20px',
  });

  logoStyle = () => (this.state.isMobile
    ? { height: '40px', width: 'auto' }
    : { height: '48px', width: 'auto', display: 'block', margin: '0 auto' });

  renderVals() {
    const { isMobile, menuOpen } = this.state;

    const barBase = { display: 'block', width: '22px', height: '2px', background: 'rgb(61, 54, 48)', transition: 'transform 0.25s ease, opacity 0.25s ease' };
    const barTopStyle = menuOpen ? { ...barBase, transform: 'translateY(7px) rotate(45deg)' } : barBase;
    const barMidStyle = menuOpen ? { ...barBase, opacity: 0 } : barBase;
    const barBotStyle = menuOpen ? { ...barBase, transform: 'translateY(-7px) rotate(-45deg)' } : barBase;
    const menuOverlayStyle = {
      position: 'fixed', inset: 0, zIndex: 90, background: '#F7F4ED',
      display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', gap: '28px',
      opacity: menuOpen ? 1 : 0, pointerEvents: menuOpen ? 'auto' : 'none',
      transform: menuOpen ? 'translateY(0)' : 'translateY(-12px)',
      transition: 'opacity 0.25s ease, transform 0.25s ease',
    };
    const menuLinkStyle = { fontFamily: "'Jost', sans-serif", fontSize: '16px', letterSpacing: '1.5px', textTransform: 'uppercase', color: '#800020', textDecoration: 'none' };
    const navLinkStyle = { fontFamily: "'Jost', sans-serif", fontSize: '13px', letterSpacing: '1.5px', textTransform: 'uppercase', color: 'rgb(61, 54, 48)', textDecoration: 'none', whiteSpace: 'nowrap' };
    const menuButtonStyle = { background: 'none', border: 'none', cursor: 'pointer', padding: '10px', display: isMobile ? 'flex' : 'none', flexDirection: 'column', gap: '5px', width: '44px', height: '44px', alignItems: 'center', justifyContent: 'center', justifySelf: 'end' };

    return {
      notMobile: !isMobile, isMobile, menuOpen,
      toggleMenu: this.toggleMenu, closeMenu: this.closeMenu,
      navStyle: this.navStyle(), navLinkStyle, logoStyle: this.logoStyle(), menuButtonStyle,
      barTopStyle, barMidStyle, barBotStyle, menuOverlayStyle, menuLinkStyle,
    };
  }
}

</script>
</body>
</html>
